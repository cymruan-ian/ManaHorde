<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#f4f0e7"/>
  <!-- Stacked horde base to convey abundance of cards -->
  <rect x="116" y="348" width="280" height="72" rx="18" fill="#d9ceba" stroke="#fffdf8" stroke-width="8"/>
  <rect x="128" y="330" width="256" height="72" rx="18" fill="#cbb98f" stroke="#fffdf8" stroke-width="8"/>
  <!-- Fanned 5-colour WUBRG cards -->
  <g stroke="#fffdf8" stroke-width="10" stroke-linejoin="round">
    <rect x="196" y="102" width="120" height="178" rx="18" fill="#f1df9a" transform="rotate(-32 256 360)"/>
    <rect x="196" y="96" width="120" height="178" rx="18" fill="#5b97d2" transform="rotate(-16 256 360)"/>
    <rect x="196" y="92" width="120" height="178" rx="18" fill="#3c4746"/>
    <rect x="196" y="96" width="120" height="178" rx="18" fill="#d85c54" transform="rotate(16 256 360)"/>
    <rect x="196" y="102" width="120" height="178" rx="18" fill="#4e9a62" transform="rotate(32 256 360)"/>
  </g>
  <!-- Subtle card-frame lines & mana pips on the front-most cards -->
  <g fill="none" stroke="#fffdf8" stroke-opacity="0.45" stroke-width="4">
    <rect x="208" y="114" width="96" height="154" rx="10" transform="rotate(-32 256 360)"/>
    <rect x="208" y="108" width="96" height="154" rx="10" transform="rotate(-16 256 360)"/>
    <rect x="208" y="104" width="96" height="154" rx="10"/>
    <rect x="208" y="108" width="96" height="154" rx="10" transform="rotate(16 256 360)"/>
    <rect x="208" y="114" width="96" height="154" rx="10" transform="rotate(32 256 360)"/>
  </g>
  <!-- Foreground deck collar anchoring the fan -->
  <rect x="142" y="308" width="228" height="76" rx="18" fill="#173e32" stroke="#fffdf8" stroke-width="10"/>
  <rect x="166" y="338" width="180" height="16" rx="8" fill="#dfc38a"/>
</svg>
